# Docker Compose configuration for Cloud Deployment (Azure & IBM Cloud)
# Uses OpenVPN Access Server for VPN connectivity to lab environment

version: '3.8'

services:
  # Main backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_training_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - VPN_SERVER_IP=${VPN_SERVER_IP:-10.10.10.1}
      - OVPN_PORT=1194
      - OVPN_PROTO=udp
      - LAB_SUBNET=10.10.10.0/24
      - DATABASE_URL=postgresql://cyberuser:cyberpass@db:5432/cybertraining
    networks:
      - cyber_training_network
      - lab_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Next.js app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.nextjs
    container_name: cyber_training_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
    networks:
      - cyber_training_network
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: cyber_training_db
    environment:
      - POSTGRES_DB=cybertraining
      - POSTGRES_USER=cyberuser
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cyberpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyber_training_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cyberuser" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # OpenVPN Access Server
  # Provides VPN access for students to connect to lab environment
  openvpn-as:
    image: openvpn/openvpn-as
    container_name: cyber_training_vpn_as
    ports:
      - "943:943" # Admin web interface
      - "443:443" # HTTPS VPN portal
      - "1194:1194/udp" # OpenVPN UDP
    volumes:
      - openvpn_data:/openvpn
    environment:
      - ADMIN_PASSWORD=${VPN_ADMIN_PASSWORD:-openvpn}
      # IMPORTANT: Set your server's public IP or hostname here for VPN clients to connect
      - OVPN_HOSTNAME=${VPN_PUBLIC_IP:-YOUR_SERVER_IP_OR_DOMAIN}
      - OVPN_NETWORK=10.8.0.0/24
      - OVPN_SUBNET=10.10.10.0/24
      - OVPN_SERVER=10.10.10.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - lab_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:943" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker Host for Lab Machines
  # DinD (Docker-in-Docker) for running vulnerable lab containers
  docker-host:
    image: docker:24-dind
    container_name: cyber_training_docker_host
    privileged: true
    volumes:
      - docker_data:/var/lib/docker
      - lab_images:/lab/images
    networks:
      - lab_network
    environment:
      - DOCKER_TLS_CERTDIR=
    healthcheck:
      test: [ "CMD", "docker", "info" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:latest
  #   container_name: cyber_training_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - cyber_training_network
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped

volumes:
  sqlite_data:
  postgres_data:
  openvpn_data:
  docker_data:
  lab_images:


networks:
  # Main application network
  cyber_training_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # Lab network for vulnerable machines (10.10.10.x)
  lab_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
